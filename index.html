
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Pulse Sound Store</title>

<style>
*{box-sizing:border-box}
:root{
  --red:#ed2929;
  --red-dark:#a91010;
  --bg:#090909;
  --panel:#151515;
  --panel-light:#1d1d1d;
  --border:#292929;
  --muted:#999;
}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:Arial,sans-serif;
}
button{cursor:pointer;font-family:inherit}
button:disabled{opacity:1;cursor:not-allowed}
header{
  padding:15px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:rgba(9,9,9,.94);
  backdrop-filter:blur(14px);
  z-index:10;
}
.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:1px;
}
.logo span,.hero h1 span{color:var(--red)}
.cart-button,.add,.checkout{
  background:linear-gradient(135deg,#ff3535,#c81717);
  color:white;
  border:0;
  border-radius:10px;
  padding:12px 15px;
  font-weight:bold;
  box-shadow:0 5px 18px rgba(237,41,41,.17);
  transition:transform .2s,box-shadow .2s;
}
.cart-button:active,.add:active,.checkout:active{
  transform:scale(.97);
}
.cart-button:hover,.add:not(:disabled):hover,.checkout:hover{
  box-shadow:0 5px 23px rgba(237,41,41,.35);
}
#cart-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:21px;
  height:21px;
  padding:0 5px;
  background:#fff;
  color:#d51c1c;
  border-radius:20px;
  font-size:12px;
  margin-left:3px;
}
.hero{
  position:relative;
  padding:49px 20px 43px;
  text-align:center;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 110%,rgba(237,41,41,.18),transparent 65%),
    linear-gradient(135deg,#1b1b1b,#090909 75%);
  border-bottom:1px solid #252525;
}
.hero:before{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  border:1px solid rgba(237,41,41,.13);
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-35%);
  pointer-events:none;
}
.hero h1{
  position:relative;
  font-size:34px;
  letter-spacing:3px;
  margin:0 0 12px;
  font-weight:900;
}
.hero p{
  position:relative;
  color:#aaa;
  margin:0;
  font-size:14px;
  letter-spacing:.5px;
}

/* Плавная неоновая анимация ЭКГ */
.hero-line{
  position:relative;
  width:min(320px,85%);
  height:48px;
  margin:20px auto 0;
  overflow:visible;
}
.hero-line svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
}
.pulse-base{
  fill:none;
  stroke:#351010;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.pulse-moving{
  fill:none;
  stroke:#ff2929;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:48 272;
  animation:pulseTravel 2.3s linear infinite;
  filter:
    drop-shadow(0 0 3px rgba(255,35,35,.95))
    drop-shadow(0 0 7px rgba(255,20,20,.7))
    drop-shadow(0 0 13px rgba(255,0,0,.4));
}
@keyframes pulseTravel{
  from{stroke-dashoffset:320}
  to{stroke-dashoffset:0}
}
@media(prefers-reduced-motion:reduce){
  .pulse-moving{animation:none}
}

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:17px 15px;
  scrollbar-width:none;
}
.categories::-webkit-scrollbar{display:none}
.category{
  flex-shrink:0;
  border:1px solid #383838;
  color:#ccc;
  background:#151515;
  padding:10px 15px;
  border-radius:25px;
  font-size:13px;
  transition:.2s;
}
.category.active{
  background:var(--red);
  color:white;
  border-color:var(--red);
  box-shadow:0 4px 15px rgba(237,41,41,.25);
}
.section-title{
  padding:0 16px;
  font-size:21px;
  font-weight:800;
  margin:9px 0 5px;
}
#products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
  padding:13px;
}
.product{
  background:linear-gradient(145deg,#1b1b1b,#111);
  border:1px solid #292929;
  border-radius:15px;
  overflow:hidden;
  min-width:0;
  cursor:pointer;
  transition:transform .22s,border-color .22s,box-shadow .22s;
}
.product:active{transform:scale(.985)}
.photo{
  position:relative;
  height:210px;
  background:radial-gradient(ellipse at center,#292929 0%,#171717 65%,#111 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.photo:after{
  content:"";
  position:absolute;
  left:15%;
  right:15%;
  bottom:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(237,41,41,.3),transparent);
  pointer-events:none;
}
.photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  cursor:zoom-in;
  transition:transform .35s;
}
.product:hover .photo img{transform:scale(1.035)}
.photo-placeholder{font-size:52px;filter:drop-shadow(0 5px 10px #000)}
.gallery-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:35px;
  height:35px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  background:rgba(0,0,0,.72);
  color:white;
  font-size:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
  padding:0;
}
.gallery-arrow.left{left:7px}
.gallery-arrow.right{right:7px}
.gallery-dots{
  position:absolute;
  bottom:9px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:7px;
  z-index:2;
}
.gallery-dot{
  width:7px;
  height:7px;
  border:0;
  border-radius:50%;
  background:#777;
  padding:0;
}
.gallery-dot.active{
  background:var(--red);
  box-shadow:0 0 8px rgba(237,41,41,.8);
}
.info{padding:13px}
.info h3{
  font-size:15px;
  line-height:1.3;
  margin:0 0 8px;
  font-weight:800;
}
.info p{
  font-size:12px;
  color:#999;
  min-height:31px;
  line-height:1.45;
  margin:0 0 11px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.price{
  font-size:19px;
  font-weight:900;
  margin-bottom:12px;
  letter-spacing:.2px;
}
.add{
  width:100%;
  padding:11px 8px;
  font-size:12px;
  letter-spacing:.3px;
}
.add.out-of-stock{
  background:#260909;
  color:#ff4545;
  border:1px solid #ff2929;
  text-shadow:0 0 5px #ff2222,0 0 12px rgba(255,35,35,.9);
  box-shadow:0 0 7px rgba(255,25,25,.65),inset 0 0 12px rgba(255,25,25,.2);
  animation:redGlow 1.8s ease-in-out infinite alternate;
}
@keyframes redGlow{
  from{
    box-shadow:0 0 5px rgba(255,25,25,.45),inset 0 0 8px rgba(255,25,25,.12);
    text-shadow:0 0 5px rgba(255,35,35,.7);
  }
  to{
    box-shadow:0 0 13px rgba(255,25,25,.9),0 0 22px rgba(255,25,25,.35),inset 0 0 13px rgba(255,25,25,.25);
    text-shadow:0 0 7px #ff2222,0 0 15px rgba(255,35,35,.9);
  }
}
.empty{
  color:#999;
  text-align:center;
  padding:30px 15px;
  grid-column:1/-1;
}
.error-text{color:#ff7777}

/* Страница товара */
#product-page{
  display:none;
  padding:16px;
  max-width:650px;
  margin:auto;
}
.back-button{
  background:#1b1b1b;
  color:#ddd;
  border:1px solid #383838;
  border-radius:10px;
  padding:11px 15px;
  margin-bottom:16px;
}
.detail-photo{
  position:relative;
  background:
    radial-gradient(ellipse at center,#292929,#141414 72%);
  border:1px solid #303030;
  border-radius:17px;
  overflow:hidden;
  height:360px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 12px 35px rgba(0,0,0,.3);
}
.detail-photo:after{
  content:"";
  position:absolute;
  bottom:0;
  left:12%;
  right:12%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(237,41,41,.4),transparent);
}
.detail-photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  cursor:zoom-in;
  transition:transform .3s;
}
.detail-photo img:active{transform:scale(.98)}
.detail-photo .gallery-arrow{
  width:42px;
  height:42px;
  font-size:30px;
}
.detail-photo .gallery-dots{bottom:13px}
.detail-title{
  font-size:27px;
  line-height:1.2;
  margin:22px 0 9px;
  font-weight:900;
}
.detail-price{
  font-size:29px;
  font-weight:900;
  margin:13px 0;
}
.stock{
  display:inline-flex;
  align-items:center;
  font-size:13px;
  margin:5px 0 4px;
  font-weight:bold;
  padding:8px 11px;
  border-radius:8px;
  background:#102014;
  border:1px solid #244a2c;
}
.stock.available{
  color:#8edb91;
  text-shadow:0 0 6px rgba(80,255,100,.4);
}
.stock.unavailable{
  color:#ff4545;
  background:#260909;
  border-color:#762020;
  text-shadow:0 0 6px #ff2222,0 0 13px rgba(255,35,35,.8);
  animation:redGlow 1.8s ease-in-out infinite alternate;
}
.detail-section{
  background:linear-gradient(145deg,#1b1b1b,#131313);
  border:1px solid #303030;
  border-radius:14px;
  padding:17px;
  margin-top:15px;
  box-shadow:0 8px 22px rgba(0,0,0,.13);
}
.detail-section h3{
  margin:0 0 13px;
  font-size:16px;
  font-weight:800;
}
.detail-section h3:before{
  content:"";
  display:inline-block;
  width:3px;
  height:15px;
  background:var(--red);
  border-radius:3px;
  margin-right:9px;
  vertical-align:-2px;
}
.detail-description{
  color:#c2c2c2;
  line-height:1.65;
  font-size:14px;
  white-space:pre-wrap;
}
.spec-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:12px 0;
  border-bottom:1px solid #303030;
  font-size:13px;
}
.spec-row:last-child{border-bottom:0}
.spec-name{color:#999}
.spec-value{
  text-align:right;
  overflow-wrap:anywhere;
  font-weight:bold;
}
.detail-add{
  width:100%;
  padding:16px;
  font-size:15px;
  margin-top:18px;
  letter-spacing:.4px;
}

/* Увеличенное фото */
#lightbox{
  display:none;
  position:fixed;
  inset:0;
  padding:25px;
  background:rgba(0,0,0,.91);
  backdrop-filter:blur(7px);
  z-index:50;
  align-items:center;
  justify-content:center;
}
#lightbox img{
  display:block;
  width:min(88vw,900px);
  height:min(82vh,800px);
  object-fit:contain;
  background:#171717;
  border:1px solid #444;
  border-radius:16px;
  padding:8px;
  cursor:zoom-out;
  box-shadow:0 15px 55px #000;
}
#lightbox-close{
  position:absolute;
  right:18px;
  top:18px;
  background:#292929;
  color:white;
  border:1px solid #555;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:25px;
  z-index:2;
}

/* Модальные окна */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.83);
  backdrop-filter:blur(5px);
  z-index:30;
  padding:18px;
  overflow-y:auto;
}
.modal-content{
  background:linear-gradient(145deg,#1b1b1b,#111);
  border:1px solid #383838;
  border-radius:17px;
  padding:19px;
  max-width:450px;
  margin:35px auto;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
}
.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.modal-header h2{font-size:21px}
.close{
  background:none;
  color:white;
  border:0;
  font-size:29px;
}
.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:13px 0;
  border-bottom:1px solid #333;
}
.cart-item-name{
  flex:1;
  font-size:13px;
  line-height:1.5;
}
.cart-item-name small{color:#aaa}
.quantity{
  display:flex;
  align-items:center;
  gap:8px;
}
.quantity button{
  background:#333;
  color:white;
  border:1px solid #444;
  border-radius:7px;
  width:29px;
  height:29px;
  font-size:17px;
}
.remove{
  background:none;
  color:var(--red);
  border:0;
  font-size:21px;
}
.total{
  font-size:20px;
  font-weight:bold;
  margin:19px 0;
}
.checkout{
  width:100%;
  padding:14px;
  font-size:14px;
}
.field{margin:14px 0}
.field label{
  display:block;
  margin-bottom:7px;
  color:#bbb;
  font-size:13px;
}
.field input,.field textarea,.field select{
  width:100%;
  padding:13px;
  border:1px solid #414141;
  border-radius:9px;
  background:#090909;
  color:white;
  font-size:15px;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:var(--red);
  box-shadow:0 0 0 2px rgba(237,41,41,.12);
}
.field textarea{min-height:75px;resize:vertical}
.order-summary{
  background:#101010;
  border:1px solid #333;
  border-radius:12px;
  padding:14px;
  margin:17px 0;
}
.order-summary h3{margin:0 0 10px;font-size:16px}
.order-total{
  font-size:18px;
  font-weight:bold;
  color:var(--red);
}
.delivery-note{
  font-size:12px;
  color:#999;
  line-height:1.5;
  margin-top:10px;
}
footer{
  padding:27px 15px;
  text-align:center;
  color:#777;
  border-top:1px solid #292929;
  margin-top:28px;
  font-size:12px;
  line-height:1.8;
  letter-spacing:.5px;
}
footer span{color:var(--red);font-weight:bold}

@media(min-width:700px){
  #products{grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;padding:18px}
  .photo{height:230px}
  .hero{padding:60px 20px}
}
@media(max-width:390px){
  #products{gap:9px;padding:9px}
  .photo{height:180px}
  .info{padding:10px}
  .info h3{font-size:14px}
  .price{font-size:17px}
  .add{font-size:11px;padding:10px 5px}
  .detail-photo{height:300px}
  #lightbox{padding:15px}
  #lightbox img{width:92vw;height:78vh}
}
</style>
</head>

<body>

<header>
  <div class="logo">PULSE <span>SOUND</span></div>
  <button class="cart-button" onclick="openCart()">🛒 Корзина <span id="cart-count">0</span></button>
</header>

<main id="catalog-page">
  <section class="hero">
    <h1>PULSE <span>SOUND</span></h1>
    <p>Магазин автомобильного звука</p>

    <div class="hero-line">
      <svg viewBox="0 0 320 44" preserveAspectRatio="none">
        <path class="pulse-base"
          d="M0 22 H105 L116 22 L126 8 L137 36 L148 14 L158 22 H320"/>

        <path class="pulse-moving"
          d="M0 22 H105 L116 22 L126 8 L137 36 L148 14 L158 22 H320"/>
      </svg>
    </div>
  </section>

  <div class="categories">
    <button class="category active" onclick="filterProducts('all',this)">Все товары</button>
    <button class="category" onclick="filterProducts('sub',this)">Сабвуферы</button>
    <button class="category" onclick="filterProducts('amp',this)">Усилители</button>
    <button class="category" onclick="filterProducts('speaker',this)">Динамики</button>
    <button class="category" onclick="filterProducts('accessory',this)">Аксессуары</button>
  </div>

  <h2 class="section-title">Каталог товаров</h2>
  <div id="products"><div class="empty">Загружаем каталог...</div></div>
</main>

<main id="product-page">
  <button class="back-button" onclick="closeProduct()">← Назад в каталог</button>
  <div id="product-detail"></div>
</main>

<div id="lightbox" onclick="closeLightbox()">
  <button id="lightbox-close" onclick="closeLightbox()">×</button>
  <img id="lightbox-image" src="" alt="Фото товара" onclick="event.stopPropagation()">
</div>

<div class="modal" id="cart-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Корзина</h2>
      <button class="close" onclick="closeCart()">×</button>
    </div>
    <div id="cart-items"></div>
    <div class="total" id="cart-total">Итого: 0 ₽</div>
    <button class="checkout" onclick="openOrder()">Оформить заказ</button>
  </div>
</div>

<div class="modal" id="order-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Оформление</h2>
      <button class="close" onclick="closeOrder()">×</button>
    </div>

    <form id="order-form">
      <div class="field">
        <label for="customer-name">Ваше имя</label>
        <input id="customer-name" required placeholder="Введите имя">
      </div>
      <div class="field">
        <label for="customer-phone">Телефон</label>
        <input id="customer-phone" required type="tel" placeholder="+7...">
      </div>
      <div class="field">
        <label for="delivery-method">Способ доставки</label>
        <select id="delivery-method" required>
          <option value="local">Доставка по городу — 300 ₽</option>
          <option value="other">Доставка в другой город — стоимость уточним</option>
        </select>
      </div>
      <div class="field">
        <label for="delivery-address">Адрес доставки</label>
        <input id="delivery-address" required placeholder="Город, улица, дом, квартира">
      </div>
      <div class="field">
        <label for="customer-comment">Комментарий</label>
        <textarea id="customer-comment" placeholder="Дополнительная информация"></textarea>
      </div>
      <div class="order-summary" id="order-summary">
        <h3>Ваш заказ</h3>
      </div>
      <button class="checkout" type="submit">Подтвердить заказ</button>
      <p class="delivery-note">При доставке в другой город стоимость будет согласована отдельно.</p>
    </form>
  </div>
</div>

<footer>
  <span>PULSE SOUND STORE</span><br>
  Автозвук без компромиссов
</footer>

<script>
"use strict";

const API_URL="https://pwxnijzrywcukatlyllc.supabase.co/functions/v1/products-api";
const ORDER_URL="https://pwxnijzrywcukatlyllc.supabase.co/functions/v1/telegram-order";

let items=[];
let cart=[];
let currentCategory="all";
let galleryIndexes={};
let detailProductId=null;
let detailPhotoIndex=0;

const emojis={sub:"🔊",amp:"🔌",speaker:"🔈",accessory:"🧰"};

function money(value){
  return Number(value||0).toLocaleString("ru-RU")+" ₽";
}

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,char=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[char]));
}

function safeImage(url){
  if(!url)return "";
  try{
    const parsed=new URL(url);
    if(parsed.protocol==="https:"||parsed.protocol==="http:")return parsed.href;
  }catch(e){}
  return "";
}

/* Загрузка каталога */
async function loadProducts(){
  const box=document.getElementById("products");

  try{
    const response=await fetch(API_URL);
    if(!response.ok)throw new Error("Supabase ответил с ошибкой: "+response.status);

    const result=await response.json();
    const productList=Array.isArray(result)?result:result.products;

    if(!Array.isArray(productList))throw new Error("API вернул данные в неизвестном формате");

    items=productList.map(p=>({
      id:Number(p.id),
      name:p.name,
      cat:p.category||"accessory",
      desc:p.description||"",
      price:Number(p.price),
      stock:Number(p.stock||0),
      images:[p.image_url,p.image_url_2,p.image_url_3].map(safeImage).filter(Boolean),
      specs:p.specifications||p.specs||null,
      emoji:emojis[p.category]||"🔊"
    })).filter(p=>p.id&&p.name);

    cart=cart.map(old=>{
      const fresh=items.find(p=>p.id===old.id);
      return fresh?{...fresh,qty:old.qty}:old;
    });

    render();
    updateCart();

    if(detailProductId!==null)renderProductDetail();

  }catch(error){
    console.error("Ошибка загрузки каталога:",error);
    box.innerHTML='<div class="empty error-text">Не удалось загрузить каталог. Обновите страницу позже.</div>';
  }
}

/* Отрисовка каталога */
function render(list){
  const box=document.getElementById("products");
  const products=list||(currentCategory==="all"?items:items.filter(p=>p.cat===currentCategory));

  if(!products.length){
    box.innerHTML='<div class="empty">В этой категории пока нет товаров.</div>';
    return;
  }

  box.innerHTML=products.map(p=>{
    const photos=p.images||[];
    const index=galleryIndexes[p.id]||0;
    const photo=photos[index]||"";
    const inStock=p.stock>0;

    return `
      <div class="product" onclick="openProduct(${p.id})">
        <div class="photo">
          ${photo?`
            <img src="${escapeHTML(photo)}" alt="${escapeHTML(p.name)}"
              onclick="event.stopPropagation();openProduct(${p.id})">
            ${photos.length>1?`
              <button class="gallery-arrow left" onclick="event.stopPropagation();changeCardPhoto(${p.id},-1)">‹</button>
              <button class="gallery-arrow right" onclick="event.stopPropagation();changeCardPhoto(${p.id},1)">›</button>
              <div class="gallery-dots">
                ${photos.map((url,i)=>`
                  <button class="gallery-dot ${i===index?"active":""}" onclick="event.stopPropagation();selectCardPhoto(${p.id},${i})"></button>
                `).join("")}
              </div>
            `:""}
          `:`<div class="photo-placeholder">${p.emoji}</div>`}
        </div>
        <div class="info">
          <h3>${escapeHTML(p.name)}</h3>
          <p>${escapeHTML(p.desc)}</p>
          <div class="price">${money(p.price)}</div>
          <button class="add ${inStock?"":"out-of-stock"}" ${inStock?"":"disabled"}
            onclick="event.stopPropagation();addToCart(${p.id})">
            ${inStock?"В корзину":"Нет в наличии"}
          </button>
        </div>
      </div>
    `;
  }).join("");
}

function changeCardPhoto(id,direction){
  const p=items.find(x=>x.id===id);
  if(!p||p.images.length<2)return;
  galleryIndexes[id]=((galleryIndexes[id]||0)+direction+p.images.length)%p.images.length;
  render();
}

function selectCardPhoto(id,index){
  const p=items.find(x=>x.id===id);
  if(!p||!p.images[index])return;
  galleryIndexes[id]=index;
  render();
}

function filterProducts(category,button){
  currentCategory=category;
  document.querySelectorAll(".category").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  render();
}

/* Страница товара */
function openProduct(id){
  const p=items.find(x=>x.id===id);
  if(!p)return;

  detailProductId=id;
  detailPhotoIndex=0;

  document.getElementById("catalog-page").style.display="none";
  document.getElementById("product-page").style.display="block";

  renderProductDetail();
  window.scrollTo(0,0);
}

function closeProduct(){
  document.getElementById("product-page").style.display="none";
  document.getElementById("catalog-page").style.display="block";
  detailProductId=null;
  window.scrollTo(0,0);
}

function renderProductDetail(){
  const p=items.find(x=>x.id===detailProductId);
  if(!p)return;

  const photos=p.images||[];
  const photo=photos[detailPhotoIndex]||"";
  const inStock=p.stock>0;

  let specsHTML="";

  if(p.specs&&typeof p.specs==="object"){
    const entries=Array.isArray(p.specs)
      ?p.specs.map(s=>[s.name||s.title,s.value])
      :Object.entries(p.specs);

    specsHTML=entries
      .filter(([name,value])=>name&&value!==undefined&&value!==null&&value!=="")
      .map(([name,value])=>`
        <div class="spec-row">
          <span class="spec-name">${escapeHTML(name)}</span>
          <span class="spec-value">${escapeHTML(value)}</span>
        </div>
      `).join("");
  }

  document.getElementById("product-detail").innerHTML=`
    <div class="detail-photo">
      ${photo?`
        <img src="${escapeHTML(photo)}" alt="${escapeHTML(p.name)}"
          onclick="openLightbox(this.src)">
        ${photos.length>1?`
          <button class="gallery-arrow left" onclick="changeDetailPhoto(-1)">‹</button>
          <button class="gallery-arrow right" onclick="changeDetailPhoto(1)">›</button>
          <div class="gallery-dots">
            ${photos.map((url,i)=>`
              <button class="gallery-dot ${i===detailPhotoIndex?"active":""}" onclick="selectDetailPhoto(${i})"></button>
            `).join("")}
          </div>
        `:""}
      `:`<div class="photo-placeholder">${p.emoji}</div>`}
    </div>

    <h1 class="detail-title">${escapeHTML(p.name)}</h1>
    <div class="detail-price">${money(p.price)}</div>
    <div class="stock ${inStock?"available":"unavailable"}">
      ${inStock?"✓ В наличии: "+p.stock+" шт.":"✕ Нет в наличии"}
    </div>

    <div class="detail-section">
      <h3>Описание товара</h3>
      <div class="detail-description">${escapeHTML(p.desc||"Описание скоро появится.")}</div>
    </div>

    <div class="detail-section">
      <h3>Характеристики</h3>
      ${specsHTML||'<div class="detail-description">Характеристики этого товара пока не заполнены.</div>'}
    </div>

    <button class="add detail-add ${inStock?"":"out-of-stock"}"
      onclick="addToCart(${p.id})" ${inStock?"":"disabled"}>
      ${inStock?"Добавить в корзину":"Нет в наличии"}
    </button>
  `;
}

function changeDetailPhoto(direction){
  const p=items.find(x=>x.id===detailProductId);
  if(!p||p.images.length<2)return;
  detailPhotoIndex=(detailPhotoIndex+direction+p.images.length)%p.images.length;
  renderProductDetail();
}

function selectDetailPhoto(index){
  const p=items.find(x=>x.id===detailProductId);
  if(!p||!p.images[index])return;
  detailPhotoIndex=index;
  renderProductDetail();
}

/* Открытие увеличенной фотографии */
function openLightbox(url){
  if(!url)return;

  const lightbox=document.getElementById("lightbox");
  const image=document.getElementById("lightbox-image");

  image.src=url;
  lightbox.style.display="flex";
  document.body.style.overflow="hidden";
}

function closeLightbox(){
  const lightbox=document.getElementById("lightbox");
  const image=document.getElementById("lightbox-image");

  lightbox.style.display="none";
  image.src="";
  document.body.style.overflow="";
}

/* Корзина */
function addToCart(id){
  const p=items.find(x=>x.id===id);
  if(!p)return;

  const existing=cart.find(x=>x.id===id);

  if(existing){
    if(existing.qty>=p.stock){
      alert("Больше товаров нет в наличии");
      return;
    }
    existing.qty++;
  }else{
    if(p.stock<1){
      alert("Товара сейчас нет в наличии");
      return;
    }
    cart.push({...p,qty:1});
  }

  updateCart();
}

function updateCart(){
  document.getElementById("cart-count").textContent=cart.reduce((s,p)=>s+p.qty,0);

  const container=document.getElementById("cart-items");

  if(!cart.length){
    container.innerHTML='<div class="empty">Корзина пока пустая</div>';
  }else{
    container.innerHTML=cart.map(p=>`
      <div class="cart-item">
        <div class="cart-item-name">
          ${escapeHTML(p.name)}<br>
          <small>${money(p.price)}</small>
        </div>
        <div class="quantity">
          <button onclick="changeQuantity(${p.id},-1)">−</button>
          <span>${p.qty}</span>
          <button onclick="changeQuantity(${p.id},1)">+</button>
        </div>
        <button class="remove" onclick="removeFromCart(${p.id})">×</button>
      </div>
    `).join("");
  }

  const total=cart.reduce((s,p)=>s+p.price*p.qty,0);
  document.getElementById("cart-total").textContent="Итого: "+money(total);
  calculateOrder();
}

function changeQuantity(id,change){
  const p=cart.find(x=>x.id===id);
  if(!p)return;

  const catalog=items.find(x=>x.id===id);
  const next=p.qty+change;

  if(next<=0){
    removeFromCart(id);
    return;
  }

  if(catalog&&next>catalog.stock){
    alert("Больше товаров нет в наличии");
    return;
  }

  p.qty=next;
  updateCart();
}

function removeFromCart(id){
  cart=cart.filter(p=>p.id!==id);
  updateCart();
}

function openCart(){
  updateCart();
  document.getElementById("cart-modal").style.display="block";
}

function closeCart(){
  document.getElementById("cart-modal").style.display="none";
}

function openOrder(){
  if(!cart.length){
    alert("Корзина пустая");
    return;
  }

  closeCart();
  document.getElementById("order-modal").style.display="block";
  calculateOrder();
}

function closeOrder(){
  document.getElementById("order-modal").style.display="none";
}

/* Расчёт доставки */
function calculateOrder(){
  const summary=document.getElementById("order-summary");
  const method=document.getElementById("delivery-method");
  if(!summary||!method)return;

  const subtotal=cart.reduce((sum,p)=>sum+p.price*p.qty,0);
  const local=method.value==="local";
  const delivery=local?300:0;
  const total=subtotal+delivery;

  summary.innerHTML=`
    <h3>Ваш заказ</h3>
    <div class="spec-row">
      <span class="spec-name">Товары</span>
      <strong>${money(subtotal)}</strong>
    </div>
    <div class="spec-row">
      <span class="spec-name">Доставка</span>
      <strong>${local?"300 ₽":"Уточняется"}</strong>
    </div>
    <div class="spec-row">
      <span>Итого</span>
      <strong class="order-total">${money(total)}${local?"":" + доставка"}</strong>
    </div>
  `;
}

document.getElementById("delivery-method").addEventListener("change",calculateOrder);

/* Отправка заказа */
document.getElementById("order-form").addEventListener("submit",async function(e){
  e.preventDefault();

  if(!cart.length){
    alert("Корзина пустая");
    return;
  }

  const name=document.getElementById("customer-name").value.trim();
  const phone=document.getElementById("customer-phone").value.trim();
  const address=document.getElementById("delivery-address").value.trim();
  const comment=document.getElementById("customer-comment").value.trim();
  const method=document.getElementById("delivery-method").value;

  if(!name||!phone||!address){
    alert("Заполните имя, телефон и адрес доставки.");
    return;
  }

  for(const cartItem of cart){
    const product=items.find(p=>p.id===cartItem.id);
    if(!product||product.stock<cartItem.qty){
      alert("Недостаточно товара: "+cartItem.name+". Обновите каталог.");
      await loadProducts();
      return;
    }
  }

  const delivery=method==="local"?300:0;

  const order={
    name,
    phone,
    address,
    comment,
    deliveryMethod:method==="local"?"Доставка по городу":"Доставка в другой город",
    delivery,
    items:cart.map(p=>({
      product_id:p.id,
      quantity:p.qty
    }))
  };

  const submitButton=this.querySelector('button[type="submit"]');
  submitButton.disabled=true;
  submitButton.textContent="Отправляем заказ...";

  try{
    const response=await fetch(ORDER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(order)
    });

    const responseText=await response.text();
    let result;

    try{
      result=JSON.parse(responseText);
    }catch(parseError){
      throw new Error("Сервер вернул непонятный ответ: "+responseText.slice(0,200));
    }

    if(!response.ok||!result.success){
      throw new Error(result.error||"Не удалось отправить заказ. Код: "+response.status);
    }

    alert("Заказ №"+(result.order_id||"")+" успешно оформлен! Скоро с вами свяжутся.");

    cart=[];
    updateCart();
    this.reset();
    calculateOrder();
    closeOrder();
    await loadProducts();

  }catch(error){
    console.error("Ошибка отправки заказа:",error);
    alert("Не удалось отправить заказ: "+error.message);
  }finally{
    submitButton.disabled=false;
    submitButton.textContent="Подтвердить заказ";
  }
});

/* Закрытие окон */
window.addEventListener("click",function(e){
  if(e.target.id==="cart-modal")closeCart();
  if(e.target.id==="order-modal")closeOrder();
  if(e.target.id==="lightbox")closeLightbox();
});

window.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    closeLightbox();
    closeCart();
    closeOrder();
  }
});

/* Запуск магазина */
updateCart();
loadProducts();
</script>
</body>
</html>
