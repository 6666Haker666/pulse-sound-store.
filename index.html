<script>
const API_URL = "https://pwxnijzrywcukatlyllc.supabase.co/functions/v1/products-api";

let items = [];
let cart = [];

const emojis = {
  sub: "🔊",
  amp: "⚡",
  speaker: "🎵",
  accessory: "🔧"
};

function money(n) {
  return Number(n).toLocaleString("ru-RU") + " ₽";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function safeImage(url) {
  try {
    const parsed = new URL(url);
    return parsed.protocol === "https:" ? parsed.href : "";
  } catch {
    return "";
  }
}

async function loadProducts() {
  const box = document.getElementById("products");
  box.innerHTML = "<p>Загружаем каталог...</p>";

  try {
    const response = await fetch(API_URL);

    if (!response.ok) {
      throw new Error("Ошибка загрузки: " + response.status);
    }

    const result = await response.json();

    if (!Array.isArray(result.products)) {
      throw new Error("Неверный формат каталога");
    }

    items = result.products.map(p => ({
      id: Number(p.id),
      name: p.name,
      cat: p.category || "accessory",
      desc: p.description || "",
      price: Number(p.price),
      image: safeImage(p.image_url),
      emoji: emojis[p.category] || "🔊"
    }));

    render();

    if (items.length === 0) {
      box.innerHTML = "<p>Пока товаров нет. Скоро каталог пополнится!</p>";
    }

  } catch (error) {
    console.error(error);
    box.innerHTML =
      "<p>Не удалось загрузить каталог. Попробуй обновить страницу.</p>";
  }
}

function render(list = items) {
  document.getElementById("products").innerHTML = list.map(p => `
    <div class="product">
      <div class="photo">
        ${p.image
          ? `<img src="${escapeHTML(p.image)}"
              alt="${escapeHTML(p.name)}"
              style="width:100%;height:100%;object-fit:contain">`
          : p.emoji}
      </div>
      <div class="info">
        <h3>${escapeHTML(p.name)}</h3>
        <p>${escapeHTML(p.desc)}</p>
        <div class="price">${money(p.price)}</div>
        <button class="add" onclick="add(${p.id})">
          В корзину
        </button>
      </div>
    </div>
  `).join("");
}

function filter(cat, btn) {
  document.querySelectorAll(".categories button")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  render(cat === "all"
    ? items
    : items.filter(p => p.cat === cat)
  );
}

function add(id) {
  const product = items.find(p => p.id === id);
  if (!product) return;

  let found = cart.find(p => p.id === id);

  if (found) {
    found.qty++;
  } else {
    cart.push({...product, qty: 1});
  }

  updateCount();
}

function updateCount() {
  document.getElementById("count").textContent =
    cart.reduce((s, p) => s + p.qty, 0);
}

function openCart() {
  document.getElementById("cartModal").style.display = "block";
  renderCart();
}

function closeCart() {
  document.getElementById("cartModal").style.display = "none";
}

function renderCart() {
  let box = document.getElementById("cartItems");

  if (!cart.length) {
    box.innerHTML = "<p>Корзина пока пуста.</p>";
    document.getElementById("total").textContent = "";
    return;
  }

  box.innerHTML = cart.map(p => `
    <div class="cartitem">
      <b>${escapeHTML(p.name)}</b><br>
      ${money(p.price)}
      <div class="qty">
        <button onclick="changeQty(${p.id},-1)">−</button>
        ${p.qty}
        <button onclick="changeQty(${p.id},1)">+</button>
        <button onclick="removeItem(${p.id})">Удалить</button>
      </div>
    </div>
  `).join("");

  let sum = cart.reduce((s, p) => s + p.price * p.qty, 0);

  document.getElementById("total").textContent =
    "Итого: " + money(sum);
}

function changeQty(id, n) {
  let p = cart.find(p => p.id === id);
  if (!p) return;

  p.qty += n;

  if (p.qty <= 0) {
    removeItem(id);
  } else {
    updateCount();
    renderCart();
  }
}

function removeItem(id) {
  cart = cart.filter(p => p.id !== id);
  updateCount();
  renderCart();
}

function openOrder() {
  if (!cart.length) {
    alert("Сначала добавь товары в корзину");
    return;
  }

  closeCart();

  document.getElementById("orderTotal").textContent =
    "К оплате: " +
    money(cart.reduce((s, p) => s + p.price * p.qty, 0));

  document.getElementById("orderModal").style.display = "block";
}

function closeOrder() {
  document.getElementById("orderModal").style.display = "none";
}

document.getElementById("orderForm")
  .addEventListener("submit", function(e) {
    e.preventDefault();

    alert("Каталог подключён. Отправка заказов будет подключена следующим этапом.");
  });

loadProducts();
</script>
