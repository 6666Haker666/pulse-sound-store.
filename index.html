
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse Sound Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial}
header{padding:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}
.logo{font-size:21px;font-weight:900;letter-spacing:2px}
.logo span{color:#ed2929}
button{cursor:pointer}
.cartbtn,.add,.checkout{background:#ed2929;color:white;border:0;padding:12px;border-radius:8px;font-weight:bold}
.hero{text-align:center;padding:45px 15px;background:linear-gradient(145deg,#222,#080808)}
.hero small{color:#ed2929;letter-spacing:3px}
.hero h1{font-size:32px}
.hero p{color:#aaa}
.section{padding:20px 15px}
.categories{display:flex;gap:8px;overflow:auto;margin-bottom:18px}
.categories button{background:#191919;color:white;border:1px solid #444;padding:10px 14px;border-radius:20px;white-space:nowrap}
.categories button.active{background:#ed2929}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.product{background:#191919;border:1px solid #333;border-radius:12px;overflow:hidden}
.photo{height:115px;background:#252525;display:grid;place-items:center;font-size:45px}
.photo img{width:100%;height:100%;object-fit:contain}
.info{padding:11px}
.info h3{font-size:15px;margin:0 0 8px}
.info p{font-size:12px;color:#aaa;min-height:28px}
.price{color:#ed2929;font-weight:bold;margin:12px 0}
.add{width:100%}
.modal{display:none;position:fixed;inset:0;background:#000e;z-index:5;overflow:auto;padding:18px}
.panel{background:#171717;border:1px solid #444;border-radius:14px;padding:18px;max-width:500px;margin:25px auto}
.panel h2{margin-top:0}
.close{float:right;background:none;color:white;border:0;font-size:25px}
.cartitem{border-bottom:1px solid #333;padding:12px 0}
.qty{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.qty button{background:#333;color:white;border:0;border-radius:6px;padding:7px 12px}
.total{font-size:20px;font-weight:bold;margin:20px 0}
input,textarea{width:100%;padding:13px;margin:7px 0 14px;background:#242424;border:1px solid #444;border-radius:8px;color:white;font-size:15px}
.checkout{width:100%;margin-top:10px}
footer{text-align:center;color:#777;padding:25px}
.status{color:#aaa;padding:15px;text-align:center;grid-column:1/-1}
</style>
</head>
<body>

<header>
<div class="logo">PULSE <span>SOUND</span></div>
<button class="cartbtn" onclick="openCart()">🛒 Корзина <b id="count">0</b></button>
</header>

<section class="hero">
<small>PREMIUM CAR AUDIO</small>
<h1>МОЩНОСТЬ<br>НАЧИНАЕТСЯ ЗДЕСЬ.</h1>
<p>Магазин автозвука Pulse Sound Store</p>
</section>

<section class="section">
<h2>Каталог товаров</h2>
<div class="categories">
<button class="active" onclick="filter('all',this)">Все товары</button>
<button onclick="filter('sub',this)">Сабвуферы</button>
<button onclick="filter('amp',this)">Усилители</button>
<button onclick="filter('speaker',this)">Динамики</button>
<button onclick="filter('accessory',this)">Аксессуары</button>
</div>
<div class="products" id="products">
<div class="status">Загружаем каталог...</div>
</div>
</section>

<div class="modal" id="cartModal">
<div class="panel">
<button class="close" onclick="closeCart()">×</button>
<h2>Твоя корзина</h2>
<div id="cartItems"></div>
<div class="total" id="total"></div>
<button class="checkout" onclick="openOrder()">ОФОРМИТЬ ЗАКАЗ</button>
</div>
</div>

<div class="modal" id="orderModal">
<div class="panel">
<button class="close" onclick="closeOrder()">×</button>
<h2>Оформление заказа</h2>
<form id="orderForm">
<label>Твоё имя</label>
<input id="customerName" placeholder="Введите имя" required>
<label>Номер телефона</label>
<input id="phone" type="tel" placeholder="+7..." required>
<label>Комментарий к заказу</label>
<textarea id="comment" rows="3" placeholder="Город, доставка и другие пожелания"></textarea>
<div id="orderTotal" class="total"></div>
<button class="checkout" type="submit">ПОДТВЕРДИТЬ ЗАКАЗ</button>
</form>
</div>
</div>

<footer>PULSE SOUND STORE © 2026</footer>

<script>
const API_URL = "https://pwxnijzrywcukatlyllc.supabase.co/functions/v1/products-api";

let items = [];
let cart = [];

const emojis = {
  sub:"🔊",
  amp:"⚡",
  speaker:"🎵",
  accessory:"🔧"
};

function money(n){
  return Number(n).toLocaleString("ru-RU")+" ₽";
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function safeImage(url){
  try{
    const parsed = new URL(url);
    return parsed.protocol === "https:" ? parsed.href : "";
  }catch{
    return "";
  }
}

async function loadProducts(){
  const box = document.getElementById("products");
  box.innerHTML = '<div class="status">Загружаем каталог...</div>';

  try{
    const response = await fetch(API_URL);

    if(!response.ok){
      throw new Error("Ошибка загрузки: "+response.status);
    }

    const result = await response.json();

    if(!Array.isArray(result.products)){
      throw new Error("Неверный формат каталога");
    }

    items = result.products.map(p=>({
      id:Number(p.id),
      name:p.name,
      cat:p.category || "accessory",
      desc:p.description || "",
      price:Number(p.price),
      image:safeImage(p.image_url),
      emoji:emojis[p.category] || "🔊"
    }));

    render();

    if(items.length===0){
      box.innerHTML='<div class="status">Пока товаров нет. Скоро каталог пополнится!</div>';
    }

  }catch(error){
    console.error(error);
    box.innerHTML='<div class="status">Не удалось загрузить каталог. Попробуй обновить страницу.</div>';
  }
}

function render(list=items){
  const box=document.getElementById("products");

  box.innerHTML=list.map(p=>`
    <div class="product">
      <div class="photo">
        ${p.image
          ? `<img src="${escapeHTML(p.image)}" alt="${escapeHTML(p.name)}">`
          : p.emoji}
      </div>
      <div class="info">
        <h3>${escapeHTML(p.name)}</h3>
        <p>${escapeHTML(p.desc)}</p>
        <div class="price">${money(p.price)}</div>
        <button class="add" onclick="add(${p.id})">В корзину</button>
      </div>
    </div>
  `).join("");
}

function filter(cat,btn){
  document.querySelectorAll(".categories button")
    .forEach(b=>b.classList.remove("active"));

  btn.classList.add("active");

  render(cat==="all"
    ? items
    : items.filter(p=>p.cat===cat)
  );
}

function add(id){
  const product=items.find(p=>p.id===id);
  if(!product)return;

  let found=cart.find(p=>p.id===id);

  if(found)found.qty++;
  else cart.push({...product,qty:1});

  updateCount();
}

function updateCount(){
  document.getElementById("count").textContent=
    cart.reduce((s,p)=>s+p.qty,0);
}

function openCart(){
  document.getElementById("cartModal").style.display="block";
  renderCart();
}

function closeCart(){
  document.getElementById("cartModal").style.display="none";
}

function renderCart(){
  let box=document.getElementById("cartItems");

  if(!cart.length){
    box.innerHTML="<p>Корзина пока пуста.</p>";
    document.getElementById("total").textContent="";
    return;
  }

  box.innerHTML=cart.map(p=>`
    <div class="cartitem">
      <b>${escapeHTML(p.name)}</b><br>${money(p.price)}
      <div class="qty">
        <button onclick="changeQty(${p.id},-1)">−</button>
        ${p.qty}
        <button onclick="changeQty(${p.id},1)">+</button>
        <button onclick="removeItem(${p.id})">Удалить</button>
      </div>
    </div>
  `).join("");

  let sum=cart.reduce((s,p)=>s+p.price*p.qty,0);
  document.getElementById("total").textContent="Итого: "+money(sum);
}

function changeQty(id,n){
  let p=cart.find(p=>p.id===id);
  if(!p)return;

  p.qty+=n;

  if(p.qty<=0)removeItem(id);
  else{
    updateCount();
    renderCart();
  }
}

function removeItem(id){
  cart=cart.filter(p=>p.id!==id);
  updateCount();
  renderCart();
}

function openOrder(){
  if(!cart.length){
    alert("Сначала добавь товары в корзину");
    return;
  }

  closeCart();

  document.getElementById("orderTotal").textContent=
    "К оплате: "+money(cart.reduce((s,p)=>s+p.price*p.qty,0));

  document.getElementById("orderModal").style.display="block";
}

function closeOrder(){
  document.getElementById("orderModal").style.display="none";
}

document.getElementById("orderForm").addEventListener("submit",function(e){
  e.preventDefault();
  alert("Каталог подключён. Отправка заказов будет подключена следующим этапом.");
});

loadProducts();
</script>
</body>
</html>
